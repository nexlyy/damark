name: Publish to GitHub Pages

# The one-link page goes at the root of the site, the shop template under
# /shop/. Every push to main publishes both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shop/package-lock.json

      - name: Build the shop template
        working-directory: shop
        run: |
          npm ci
          npm run build

      - name: Lay out the site
        run: |
          mkdir -p site/shop
          cp link/index.html site/index.html
          cp -r shop/dist/. site/shop/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
