# damark.net, first step: plain HTTP only, before there is a certificate.
#
# nginx refuses to start with an ssl_certificate path that does not exist yet,
# so the full config (nginx-damark.conf) cannot go in first. This one serves
# the site on port 80 and answers the ACME challenge, which is all certbot
# needs. Replace it with nginx-damark.conf once the certificate is issued.
#
# Goes in /etc/nginx/sites-available/damark.net, symlinked from sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name damark.net www.damark.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /var/www/damark;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
