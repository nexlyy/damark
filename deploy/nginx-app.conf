# new.damark.net — the shop and its admin while they are being built.
# Everything sits behind one password (basic auth) until launch; the app
# has its own staff logins on top.
#
# nginx serves the built files and photos itself; everything else goes to
# the Node service on 127.0.0.1:8810. This nginx is 1.24: http2 is a
# parameter of listen.

server {
    listen 80;
    listen [::]:80;
    server_name new.damark.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://new.damark.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name new.damark.net;

    ssl_certificate     /etc/letsencrypt/live/new.damark.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.damark.net/privkey.pem;

    server_tokens off;
    root /opt/damark/current/dist/web;
    client_max_body_size 30m;

    auth_basic "DaMark";
    auth_basic_user_file /etc/nginx/damark.htpasswd;

    # nginx does not merge add_header: a location with its own repeats these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Built scripts and styles carry a hash in their names.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Photos never change once written (a new photo gets a new name).
    location ^~ /media/ {
        alias /var/lib/damark/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Browsers fetch the app manifest and its icons without the password.
    location ~ ^/(icon-\d+|apple-touch-icon)\.png$ {
        auth_basic off;
    }

    location ~ \.webmanifest$ {
        auth_basic off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
