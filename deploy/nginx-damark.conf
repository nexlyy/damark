# damark.net — the link page in the TikTok and Instagram bios. Static files
# only; nothing behind them.
#
# Goes in /etc/nginx/sites-available/damark.net, symlinked from sites-enabled,
# in place of nginx-damark-http.conf once the certificate exists. This nginx is
# 1.24: http2 is a parameter of listen, not a directive of its own.

server {
    listen 80;
    listen [::]:80;
    server_name damark.net www.damark.net;

    # Certbot renews over HTTP, so this has to answer before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://damark.net$request_uri;
    }
}

# www goes to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.damark.net;

    ssl_certificate     /etc/letsencrypt/live/damark.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damark.net/privkey.pem;

    return 301 https://damark.net$request_uri;
}

# The page changes with every deploy (contacts, requisites), so a browser must
# check before reusing it: every HTML response says no-cache.
map $sent_http_content_type $damark_html_cache {
    default "";
    ~^text/html "no-cache";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name damark.net;

    ssl_certificate     /etc/letsencrypt/live/damark.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damark.net/privkey.pem;

    root /var/www/damark;
    index index.html;
    server_tokens off;

    # nginx does not merge add_header: a location with its own replaces the
    # whole inherited set, so each one below repeats these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No other site may show these pages inside its own, where a fake overlay
    # could sit on top of the real requisites.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control $damark_html_cache;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Logo and photos: they change rarely, and they are most of the weight.
    location ^~ /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # The shop demo and the other versions of this page were here while they
    # were being chosen. Until the real site is ready the domain is this page.
    location ~ ^/(shop|v|variants)(/|$) {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
