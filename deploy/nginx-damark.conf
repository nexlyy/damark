# damark.net — the link page in the TikTok and Instagram bios, and the shop
# template under /shop/. Static files only; nothing behind them.
#
# Goes in /etc/nginx/sites-available/damark.net, symlinked from sites-enabled,
# in place of nginx-damark-http.conf once the certificate exists. This nginx is
# 1.24: http2 is a parameter of listen, not a directive of its own.

server {
    listen 80;
    listen [::]:80;
    server_name damark.net www.damark.net;

    # Certbot renews over HTTP, so this has to answer before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://damark.net$request_uri;
    }
}

# www goes to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.damark.net;

    ssl_certificate     /etc/letsencrypt/live/damark.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damark.net/privkey.pem;

    return 301 https://damark.net$request_uri;
}

# A deploy replaces the shop's hashed scripts, so a page a browser kept by
# guesswork would name files that are gone: every HTML response says no-cache.
map $sent_http_content_type $damark_html_cache {
    default "";
    ~^text/html "no-cache";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name damark.net;

    ssl_certificate     /etc/letsencrypt/live/damark.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damark.net/privkey.pem;

    root /var/www/damark;
    index index.html;
    server_tokens off;

    # nginx does not merge add_header: a location with its own replaces the
    # whole inherited set, so each one below repeats these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No other site may show these pages inside its own, where a fake overlay
    # could sit on top of the real requisites.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control $damark_html_cache;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # The shop's scripts and styles carry a hash in the name.
    location ^~ /shop/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        access_log off;
    }

    # Logo and photos: they change rarely, and they are most of the weight.
    location ^~ /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # mime.types on this machine has no entry for web app manifests.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The shop is still a demo, and the variants were for choosing: both stay
    # reachable by link and out of search results.
    location ~ ^/(shop|v|variants)/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control $damark_html_cache;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
